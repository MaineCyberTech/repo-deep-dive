---
- name: Assert a supported OS family (Debian/Ubuntu, incl. Proxmox VE)
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: "base supports Debian/Ubuntu (found {{ ansible_facts.os_family }})"

- name: Refresh apt metadata and install baseline packages
  ansible.builtin.apt:
    name: "{{ base_packages + base_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the admin group exists
  ansible.builtin.group:
    name: "{{ base_admin_group }}"
    state: present

- name: Ensure the admin user exists
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    group: "{{ base_admin_group }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Install admin SSH authorized keys (only when supplied)
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ base_admin_ssh_keys }}"
  when: base_admin_ssh_keys | length > 0

- name: Allow passwordless sudo for the admin group
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ base_admin_group }}"
    content: "%{{ base_admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  notify: Restart cron

- name: Optionally enable unattended security upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: base_install_auto_updates | bool
