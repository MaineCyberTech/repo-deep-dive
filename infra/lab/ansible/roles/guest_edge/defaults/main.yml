---
# guest_edge defaults: the build/edge toolchain used for falcon-edge arm builds.
edge_install_docker: true
edge_install_qemu: true
edge_enable_binfmt: true
edge_packages:
  - build-essential
  - gcc
  - make
  - cmake
  - pkg-config
  - git
  - curl
  - ca-certificates
  - jq
  - python3
  - python3-pip
  - python3-venv
  - rsync
  - kpartx
  - parted
  - dosfstools
  - e2fsprogs
  - util-linux
  - qemu-utils
  - qemu-user-static
  - binfmt-support
  - gcc-aarch64-linux-gnu
  - g++-aarch64-linux-gnu
  - gcc-arm-linux-gnueabihf
  - g++-arm-linux-gnueabihf
