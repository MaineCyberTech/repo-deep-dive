---
# Proxmox VE host role defaults.
#
# Network management is OFF by default: the live host already has a working
# /etc/network/interfaces, and clobbering it can cut off remote access. Enable
# it deliberately (proxmox_manage_network: true) once you have console/BMC.
proxmox_manage_network: false
proxmox_bridge_name: vmbr0
proxmox_bridge_address: 172.23.128.50/24
proxmox_bridge_gateway: 172.23.128.1
proxmox_bridge_ports: []          # e.g. ["eno1"] for a real physical uplink
proxmox_lab_bridge: vmbr1         # optional second bridge for the lab VLAN
proxmox_lab_bridge_address: ""    # e.g. "172.23.129.1/24"
proxmox_lab_bridge_ports: []

proxmox_enable_ip_forward: true
proxmox_zfs_arc_max_gb: 0         # 0 = leave the kernel default
proxmox_zfs_pool: rpool

proxmox_packages:
  - ifupdown2
  - bridge-utils
  - vlan
  - zfsutils-linux
  - chrony
  - smartmontools
  - lm-sensors
  - jq
  - curl
