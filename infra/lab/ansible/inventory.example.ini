# infra/lab/ansible — example inventory (NO SECRETS).
#
#   cp inventory.example.ini inventory.ini
#   # edit hosts/bridge/ips, then:
#   ansible-playbook -i inventory.ini site.yml --check --diff
#
# Secrets never live here. The runner registration token and any admin SSH keys
# are supplied via the environment at run time, e.g.:
#   RUNNER_TOKEN=<token> ansible-playbook -i inventory.ini site.yml
#   LAB_ADMIN_SSH_KEY_FILE=~/.ssh/lab_ed25519.pub ansible-playbook ...
#
# Addresses mirror docs/LAB_ARCHITECTURE.md (Proxmox today):
#   proxmox .50 (PVE host) · ci-runner .51 (container) · edge-builder .52 (VM)

[proxmox_host]
proxmox ansible_host=172.23.128.50

[lab_runners]
ci-runner ansible_host=172.23.128.51

[lab_edge]
edge-builder ansible_host=172.23.128.52

# "lab" groups the workloads; "lab_all" groups everything incl. the hypervisor.
[lab:children]
lab_runners
lab_edge

[lab_all:children]
proxmox_host
lab
