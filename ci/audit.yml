# repo-deep-dive CI example (GitHub Actions)
#
# Reusable example for linting and validating a run folder. The in-repo wired
# workflow is `.github/workflows/audit.yml`; copy/adapt this file when the pack
# is vendored into another repository.
#
# Validates the pack itself and a chosen run folder: lint the pack, validate the
# run, normalize findings, compute the advisory score, and fail the job when P0
# findings are present.
#
# Adapt before use:
# - PACK_DIR: where the pack lives. Use `.` for an in-repo checkout (this repo),
#   or `docs/audits/repo-deep-dive` when the pack is vendored under docs/.
# - P0 gate: change `fail_on_p0: true` to `false` for advisory-only runs.
#
# This example triggers only on workflow_dispatch. A `pull_request` event has no
# run_dir input, so PR validation is handled by `.github/workflows/audit.yml`,
# which derives the changed run folder from the pull-request diff. Split PR and
# manual jobs rather than defaulting run_dir to a fixed path.

name: repo-deep-dive audit (example)

on:
  workflow_dispatch:
    inputs:
      run_dir:
        description: "Run folder to validate (e.g. runs/20260101-0000-manual)"
        required: true
        default: ""

permissions:
  contents: read

env:
  PACK_DIR: .
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check run_dir input
        run: |
          if [ -z "${{ inputs.run_dir }}" ]; then
            echo "::error::run_dir is required"
            exit 1
          fi
          if [ ! -d "${{ inputs.run_dir }}" ]; then
            echo "::error::run folder not found: ${{ inputs.run_dir }}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint pack
        run: ./tools/lint_pack.sh
        working-directory: ${{ env.PACK_DIR }}

      - name: Validate run
        run: ./tools/check_run.sh "${{ inputs.run_dir }}"
        working-directory: ${{ env.PACK_DIR }}

      - name: Run toolchain (validate, normalize, score)
        run: python3 tools/run_toolchain.py "${{ inputs.run_dir }}" --write
        working-directory: ${{ env.PACK_DIR }}

      - name: P0 gate (fail when P0 findings exist)
        run: python3 -c "import json,sys; d=json.load(open('${{ inputs.run_dir }}/findings.json')); sys.exit(1 if d['counts']['bySeverity'].get('P0',0)>0 else 0)"
        working-directory: ${{ env.PACK_DIR }}

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.sha }}
          path: |
            ${{ inputs.run_dir }}/findings.json
            ${{ inputs.run_dir }}/risk_score.json
