name: Deep-dive deterministic checks

# LLM-free machine checks across the org's repos (repo-deep-dive vocabulary).
# Runs the prompt-driven audit separately; this produces baseline findings,
# an inventory-equivalent scan, and a cross-repo rollup.
#
# Trigger on a schedule, or on demand with a repo list.

on:
  workflow_dispatch:
    inputs:
      org:
        description: GitHub organization
        required: false
        default: MaineCyberTech
      repos:
        description: Comma-separated repo names (blank = all org repos)
        required: false
        default: ''
      exclude:
        description: Comma-separated repos to skip
        required: false
        default: 'soc,infra,AWS-WWW,www,www-dev'
      runner:
        description: 'Runner label (ubuntu-latest, or a self-hosted lab label like ci-runner)'
        required: false
        default: ubuntu-latest
      deep:
        description: Run deep checks (hadolint/trivy)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

# One org-wide scan at a time; never cancel a run that may be mid-clone.
concurrency:
  group: deep-dive-deterministic
  cancel-in-progress: false

jobs:
  deterministic:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    # Gate the PAT-bearing job behind a protected environment.
    environment: deep-dive-scan
    env:
      ORG: ${{ inputs.org || 'MaineCyberTech' }}
      INPUT_REPOS: ${{ inputs.repos }}
      EXCLUDE: ${{ inputs.exclude || 'soc,infra,AWS-WWW,www,www-dev' }}
      # A PAT with org read (repo scope) is required for private repos.
      # Falls back to the workflow token (public repos only) when unset.
      GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}

    steps:
      - name: Checkout repo-deep-dive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tools (pinned versions, sha256-verified)
        if: ${{ !inputs.runner || inputs.runner == 'ubuntu-latest' }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq curl >/dev/null
          bindir="$RUNNER_TEMP/tools"
          mkdir -p "$bindir"
          # actionlint - versioned tarball, sha256-verified, unpacked without sudo.
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$bindir" actionlint
          # gitleaks - versioned tarball, sha256-verified.
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C "$bindir" gitleaks
          # hadolint + trivy (only fetched when --deep is requested)
          if [ "${{ inputs.deep }}" = "true" ]; then
            curl -sSL -o /tmp/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
            echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
            install -m 0755 /tmp/hadolint "$bindir/hadolint"
            curl -sSL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
            tar -xzf /tmp/trivy.tgz -C "$bindir" trivy
          fi
          echo "$bindir" >> "$GITHUB_PATH"
          # Fail closed: the required scanners must install and run.
          "$bindir/actionlint" --version
          "$bindir/gitleaks" version
          shellcheck --version | head -2

      - name: Determine repo list
        id: repos
        run: |
          set -e
          if [ -n "$INPUT_REPOS" ]; then
            echo "list=$INPUT_REPOS" >> "$GITHUB_OUTPUT"
          else
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/orgs/$ORG/repos?per_page=100" \
              | jq -r '.[] | select(.archived==false) | .name' | paste -sd, - > /tmp/list
            echo "list=$(cat /tmp/list)" >> "$GITHUB_OUTPUT"
          fi
          echo "repos: $(cat /tmp/list 2>/dev/null || echo "$INPUT_REPOS")"

      - name: Run deterministic checks
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
        run: |
          set -e
          echo "::add-mask::${GH_TOKEN}"
          mkdir -p work out
          EXTRA=""
          if [ "${{ inputs.deep }}" = "true" ]; then EXTRA="--deep"; fi
          IFS=',' read -ra REPOS <<< "${{ steps.repos.outputs.list }}"
          IFS=',' read -ra EXC <<< "$EXCLUDE"
          failed=0
          for raw in "${REPOS[@]}"; do
            r="$(echo "$raw" | xargs)"
            [ -z "$r" ] && continue
            skip=0
            for e in "${EXC[@]}"; do [ "$r" = "$(echo "$e" | xargs)" ] && skip=1; done
            if [ "$skip" = 1 ]; then echo "skip $r"; continue; fi
            echo "::group::$r"
            # The PAT is passed via an HTTP header, never placed in the clone URL,
            # so it cannot leak through git/shell error or diagnostic output.
            # GitHub git-over-HTTPS requires Basic auth (x-access-token:<pat>);
            # a Bearer header is only valid for the REST API and is rejected here.
            AUTH="Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            if git -c credential.helper= \
                 -c http.extraheader="AUTHORIZATION: ${AUTH}" \
                 clone -q "https://github.com/${ORG}/${r}.git" "work/$r"; then
              python3 tools/repo_inventory.py "work/$r" -o "out/$r.inventory.json" || failed=1
              python3 tools/deterministic_checks.py "work/$r" -o "out/$r" $EXTRA || failed=1
            else
              echo "::error::clone failed: $r"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more repos failed to clone or scan; failing closed"
            exit 1
          fi

      - name: Fail on P1 secret findings
        run: |
          python3 - <<'PY'
          import glob, json, sys
          sys.path.insert(0, "tools")
          import deterministic_checks as dc
          hits = []
          for p in sorted(glob.glob("out/*/deterministic-findings.json")):
              try:
                  doc = json.load(open(p, encoding="utf-8"))
              except Exception as exc:
                  print("::error::could not read %s: %s" % (p, exc), file=sys.stderr)
                  sys.exit(2)
              # Match the finding's SEC subcode (structured field, with a
              # `[SEC]` title fallback for older files), never its ID prefix:
              # deterministic IDs are namespaced `DET-*` (CI-001).
              for f in dc.p1_secret_hits(doc.get("findings", [])):
                  hits.append("%s: %s - %s" % (p, f.get("id", ""), f.get("title", "")))
          if hits:
              print("::error::P1 secret finding(s) detected; failing closed:")
              for h in hits:
                  print("  " + h)
              sys.exit(1)
          print("no P1 secret findings")
          PY

      - name: Aggregate rollup
        run: |
          set -e
          python3 tools/aggregate_findings.py out -o out/ORG_SUMMARY.md --json out/org-findings.json
          if [ -f out/ORG_SUMMARY.md ]; then cat out/ORG_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-dive-deterministic
          path: out/
          if-no-files-found: warn
