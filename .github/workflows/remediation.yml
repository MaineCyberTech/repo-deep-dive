name: Remediation runner

# Compiles a completed audit run into a remediation plan, and (optionally) opens a DRAFT
# scaffold PR per patch set. Code changes are applied by an agent/dev (see
# prompts/REMEDIATION_RUNNER.md) - this workflow never auto-merges and never self-approves.

on:
  workflow_dispatch:
    inputs:
      org:
        description: GitHub organization
        required: false
        default: MaineCyberTech
      repo:
        description: Target repository name
        required: true
      run:
        description: Run folder path inside this repo (e.g. runs/<name>/<run>)
        required: true
      patch_set:
        description: Patch set id (PS-00N) or 'all'
        required: false
        default: all
      mode:
        description: plan | scaffold-pr
        required: false
        default: plan
      base_branch:
        description: Base branch for scaffold PRs
        required: false
        default: main

permissions:
  contents: read

jobs:
  # Fail-closed gate: do not compile/scaffold remediation unless the lab overlay is
  # built out and tested (see .github/workflows/lab-preflight.yml).
  preflight:
    uses: ./.github/workflows/lab-preflight.yml
    secrets: inherit

  remediation:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      ORG: ${{ inputs.org }}
      REPO: ${{ inputs.repo }}
      RUN: ${{ inputs.run }}
      PATCH_SET: ${{ inputs.patch_set }}
      MODE: ${{ inputs.mode }}
      BASE: ${{ inputs.base_branch }}
      GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}

    steps:
      - name: Checkout repo-deep-dive (this pack)
        uses: actions/checkout@v4

      - name: Checkout target repository
        run: |
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${REPO}.git" work/"$REPO"

      - name: Compile remediation plan
        run: |
          python3 tools/remediation_plan.py "work/../$RUN" -o "/tmp/remediation_plan.json" --json | tee /tmp/plan.log || true
          # The run lives in this pack repo; if not present, expect it under the checkout.
          if [ ! -f /tmp/remediation_plan.json ]; then python3 tools/remediation_plan.py "$RUN" -o /tmp/remediation_plan.json --json; fi

      - name: Summary
        run: |
          {
            echo "## Remediation plan - $REPO"
            echo
            echo '```'
            cat /tmp/plan.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scaffold draft PR (optional)
        if: ${{ inputs.mode == 'scaffold-pr' }}
        run: |
          set -e
          cd work/"$REPO"
          git config user.name "repo-deep-dive"
          git config user.email "audit@users.noreply.github.com"
          python3 - <<'PY'
          import json
          plan=json.load(open('/tmp/remediation_plan.json'))
          import os
          os.makedirs('.audit-remediation', exist_ok=True)
          for ps in plan['patchSets']:
              if os.environ.get('PATCH_SET') not in ('all', ps['id']):
                  continue
              body=['# Remediation %s - %s' % (ps['id'], ps['title']),
                    '', 'Findings: ' + ', '.join(ps['findings']),
                    'Files: ' + ', '.join(ps['files']),
                    'Verify: ' + ' ; '.join(ps['verification']),
                    '', 'See prompts/REMEDIATION_RUNNER.md to implement.']
              open('.audit-remediation/%s.md' % ps['id'], 'w').write('\n'.join(body) + '\n')
          PY
          BR="remediation/$(echo "$PATCH_SET" | tr 'A-Z' 'a-z')-$(date -u +%Y%m%d%H%M)"
          git switch -c "$BR"
          git add .audit-remediation
          git commit -q -m "chore(remediation): scaffold plan for $PATCH_SET"
          git push -q origin "$BR"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${ORG}/${REPO}/pulls" \
            -d "{\"title\":\"remediation: ${PATCH_SET} (scaffold)\",\"head\":\"${BR}\",\"base\":\"${BASE}\",\"draft\":true,\"body\":\"Draft scaffold from repo-deep-dive. Implement per prompts/REMEDIATION_RUNNER.md. Never auto-merge.\"}"
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-plan
          path: /tmp/remediation_plan.json
          if-no-files-found: warn
