name: Pack tests

# Unit tests for the pack's parsing/inventory/deterministic logic, plus an
# archived self-test log for the tested commit (TEST-P3-004, FINAL-P2-001).
#
# Kept as its own workflow file so it stays disjoint from the audit CI
# (.github/workflows/audit.yml) and the deterministic-scan hardening
# (.github/workflows/deep-dive-deterministic.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  unit:
    name: unit tests + self-test log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Self-test (captured to log)
        run: |
          set -o pipefail
          bash tools/self_test.sh 2>&1 | tee self_test.log

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-test-log-${{ github.sha }}
          path: self_test.log
          if-no-files-found: warn
