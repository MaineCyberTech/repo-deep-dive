name: repo-deep-dive audit

# In-repo CI for the pack itself.
#
# - pack: lint the pack and run the end-to-end smoke harness on every pull
#   request and every push to main (TEST-P1-001, TEST-P2-002).
# - run-gate: on pull requests AND pushes to main, validate each archived run
#   folder changed by the diff and fail on any P0/P1 finding. Override the
#   blocking levels with the RUN_GATE_SEVERITIES repo variable. The run folder is
#   derived from the diff, never a fixed "latest" path (CI-P2-006, CI-003).
#
# The reusable vendored-layout example lives in ci/audit.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  pack:
    name: pack lint + self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint pack
        run: bash tools/lint_pack.sh

      - name: Self-test
        run: bash tools/self_test.sh

  run-gate:
    name: changed-run gate
    # Runs on pull requests AND pushes to main (CI-003). On push, the base is
    # github.event.before (falling back to HEAD~1); if no base can be resolved
    # the gate fails closed rather than skipping.
    runs-on: ubuntu-latest
    env:
      # Severity levels that block a changed run. Default P0,P1; override with
      # the repo variable RUN_GATE_SEVERITIES (e.g. "P0" for advisory P1s).
      GATE_SEVERITIES: ${{ vars.RUN_GATE_SEVERITIES || 'P0,P1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate changed runs and enforce the severity gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [ -z "$BEFORE" ]; then
              echo "::error::cannot determine a base commit for this push; failing closed"
              exit 1
            fi
            BASE="$BEFORE"
          else
            echo "::error::unsupported event ${{ github.event_name }}; failing closed"
            exit 1
          fi
          mapfile -t runs < <(
            git diff --name-only "$BASE...HEAD" -- 'runs/**' \
              | awk -F/ 'NF >= 3 { print $1 "/" $2 }' \
              | sort -u
          )
          if [ "${#runs[@]}" -eq 0 ]; then
            echo "No archived run folders changed; nothing to gate."
            exit 0
          fi
          for run in "${runs[@]}"; do
            if [ ! -d "${run}" ]; then
              echo "skipped (run folder removed): ${run}"
              continue
            fi
            echo "::group::audit ${run}"
            python3 tools/run_toolchain.py "${run}" --write
            python3 - "${run}/findings.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              doc = json.load(fh)
          # GATE_SEVERITIES defaults to P0,P1 (CI-003): P0/P1 findings block.
          sev = [s.strip() for s in os.environ.get("GATE_SEVERITIES", "P0,P1").split(",") if s.strip()]
          counts = doc.get("counts", {}).get("bySeverity", {})
          blocking = {s: int(counts.get(s, 0)) for s in sev if int(counts.get(s, 0)) > 0}
          if blocking:
              raise SystemExit("blocking findings present (%s): %s" % (",".join(sev), blocking))
          print("severity gate (%s): no findings" % ",".join(sev))
          PY
            echo "::endgroup::"
          done
