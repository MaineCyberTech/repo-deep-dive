name: Regenerate PACK_DIGEST

# PACK_DIGEST.txt is a generated inventory: any content change rewrites it, so
# two concurrent PRs conflict on it and every rebase needs a manual regen
# (observed ~6x in one session). This workflow keeps `main` self-healing by
# regenerating the digest and opening a pull request when the hashes change.
#
# Why a pull request instead of a push: the protected `main` branch requires
# review and the `Lab preflight / lab` status check. A bot that bypasses the
# ruleset with a write deploy key or a broad PAT is an avoidable privilege and
# an unreviewed code path. The workflow now writes only to the bot-owned
# `automation/pack-digest` branch and opens a normal PR.
#
# Why it cannot loop: tools/pack_digest.sh is deterministic/idempotent (no
# wall-clock timestamp). The PR branch is updated in place and a second run
# produces no diff once the PR is merged.
#
# No `PACK_DIGEST_KEY` deploy key or `PACK_DIGEST_TOKEN` PAT is used. The
# workflow's `GITHUB_TOKEN` has exactly `contents: write` (push the bot branch)
# and `pull-requests: write` (open the PR).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialise self-heal runs; a newer push supersedes an in-flight regen.
concurrency:
  group: pack-digest-pr
  cancel-in-progress: true

jobs:
  regenerate:
    # Never run this repo-specific writer against a fork or a mirror.
    if: github.repository == 'MaineCyberTech/repo-deep-dive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate PACK_DIGEST.txt
        run: bash tools/pack_digest.sh

      - name: Open or update the digest pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- PACK_DIGEST.txt; then
            echo "PACK_DIGEST.txt is already current; nothing to commit."
            exit 0
          fi

          git add PACK_DIGEST.txt
          git commit -m "chore: regenerate PACK_DIGEST"
          git checkout -B automation/pack-digest

          # Authenticate the push via a header, not the remote URL, so the token
          # cannot leak through git diagnostics or shell error output.
          AUTH="Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_AUTH=(-c credential.helper= -c "http.extraheader=AUTHORIZATION: ${AUTH}")

          # Update the bot-owned branch. It is generated output with a single
          # writer, so moving it is intentional; the lease still refuses a
          # blind overwrite if another run changed it after our fetch.
          git "${GIT_AUTH[@]}" fetch -q origin \
            "+refs/heads/automation/pack-digest:refs/remotes/origin/automation/pack-digest" \
            || true
          push_args=()
          if git rev-parse -q --verify refs/remotes/origin/automation/pack-digest >/dev/null; then
            push_args+=("--force-with-lease=refs/heads/automation/pack-digest:$(git rev-parse refs/remotes/origin/automation/pack-digest)")
          fi
          git "${GIT_AUTH[@]}" push "${push_args[@]}" origin \
            "HEAD:refs/heads/automation/pack-digest"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head automation/pack-digest --state open --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "updated the existing digest pull request #$existing"
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head automation/pack-digest \
            --title "chore: regenerate PACK_DIGEST" \
            --body "$(cat <<'EOF'
          Automated `PACK_DIGEST.txt` regeneration.

          `tools/pack_digest.sh` found that the committed digest no longer matches
          the tracked files. This pull request was generated by the
          `Regenerate PACK_DIGEST` workflow using the repository `GITHUB_TOKEN`;
          no deploy key or personal access token is used. Review the digest diff
          and merge after the required checks pass.
          EOF
          )"
