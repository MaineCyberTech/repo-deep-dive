name: Remediation board

# Publishes the org-wide remediation status board from the archived runs in this pack.
# Read-only: never pushes or merges.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, after the deterministic sweep

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build board
        run: |
          set -e
          mkdir -p out
          python3 tools/remediation_report.py --runs-dir runs --out REMEDIATION_REPORT.md --json out/remediation_report.json
          cat REMEDIATION_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-board
          path: |
            REMEDIATION_REPORT.md
            out/remediation_report.json
          if-no-files-found: warn
