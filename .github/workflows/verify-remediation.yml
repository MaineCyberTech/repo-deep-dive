name: Verify remediation

# Read-only verification pass for a remediation branch: re-runs the machine checks
# and the patch set's declared verification commands against a candidate branch, on
# the lab (self-hosted runner). Never merges, approves, or pushes.
#
# Trust boundary (CI-002): the plan's `verification` commands are arbitrary shell
# executed on a persistent runner. Only a remediation_plan.json already merged to
# the default branch is honored; a plan introduced by a PR head is not executed.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repository name
        required: true
      ref:
        description: Branch/tag/SHA under verification
        required: true
        default: main
      run:
        description: 'Pack run folder under runs/ (optional, e.g. chat-20261003-0018-develop-a72b8cc)'
        required: false
        default: ''
      patch_set:
        description: 'Patch set id to verify (optional; blank = all)'
        required: false
        default: ''
      deep:
        description: Run deep checks (hadolint/trivy)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # Fail-closed gate: verify lab access before dispatching verification to the lab.
  preflight:
    uses: ./.github/workflows/lab-preflight.yml
    secrets:
      LAB_ENDPOINT_SSH_KEY: ${{ secrets.LAB_ENDPOINT_SSH_KEY }}

  verify:
    needs: preflight
    runs-on: [self-hosted, linux, x64, ci-runner]
    env:
      ORG: ${{ github.repository_owner }}
      REPO: ${{ inputs.repo }}
      REF: ${{ inputs.ref }}
      RUN: ${{ inputs.run }}
      PATCH_SET: ${{ inputs.patch_set }}
      DEEP: ${{ inputs.deep }}
      REPO_DIR: ${{ github.workspace }}/work/${{ inputs.repo }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}

    steps:
      - name: Checkout pack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Clone target at ref
        run: |
          set -euo pipefail
          mkdir -p work
          # Pass the PAT via an HTTP header, never in the clone URL, so it cannot
          # leak through git/shell error or diagnostic output (SEC-001).
          AUTH="Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c credential.helper= \
            -c http.extraheader="AUTHORIZATION: ${AUTH}" \
            clone -q "https://github.com/${ORG}/${REPO}.git" "$REPO_DIR"
          cd "$REPO_DIR"
          git -c credential.helper= \
            -c http.extraheader="AUTHORIZATION: ${AUTH}" \
            fetch -q origin "$REF" || true
          git checkout -q "$REF"
          echo "Verifying \`$REPO\` @ \`$(git rev-parse --short HEAD)\` (\`$REF\`)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Machine checks (deterministic)
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$DEEP" = "true" ]; then EXTRA="--deep"; fi
          python3 tools/deterministic_checks.py "$REPO_DIR" -o out --run "$REPO@$REF" $EXTRA || true
          {
            echo "### Machine findings"
            echo
            if [ -f out/lens_deterministic.md ]; then sed -n '1,40p' out/lens_deterministic.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch-set verification commands
        if: ${{ inputs.run != '' }}
        run: |
          set -uo pipefail
          # Trust boundary (CI-002): remediation_plan.json supplies arbitrary
          # shell executed on the persistent self-hosted runner. A plan under
          # runs/** is PR-editable, so only a plan already merged to the default
          # branch is honored; the working-tree copy is never executed. The plan
          # is therefore review-gated input, not attacker-controlled PR content.
          PLAN="runs/$RUN/remediation_plan.json"
          git fetch --no-tags origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:$PLAN" 2>/dev/null; then
            echo "no trusted plan at origin/$DEFAULT_BRANCH:$PLAN (skipping; merge the plan to $DEFAULT_BRANCH to run it)"
            exit 0
          fi
          TRUSTED_PLAN="$(mktemp)"
          git show "origin/$DEFAULT_BRANCH:$PLAN" > "$TRUSTED_PLAN"
          export REPO_DIR PATCH_SET
          python3 - "$TRUSTED_PLAN" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, sys
          plan = json.load(open(sys.argv[1]))
          want = os.environ.get("PATCH_SET", "")
          repo_dir = os.environ["REPO_DIR"]
          lines = ["", "### Patch-set verification", "", "| Patch | Command | Exit |", "|---|---|---:|"]
          overall = 0
          for ps in plan.get("patchSets", []):
              if want and want not in ("all", ps["id"]):
                  continue
              cmds = ps.get("verification") or []
              if not cmds:
                  lines.append("| %s | _(none declared)_ | - |" % ps["id"])
                  continue
              for cmd in cmds:
                  p = subprocess.run(["bash", "-lc", cmd], cwd=repo_dir)
                  lines.append("| %s | `%s` | %d |" % (ps["id"], cmd.replace("|", "\\|"), p.returncode))
                  overall = overall or p.returncode
          print("\n".join(lines))
          print("\nVERIFY_RESULT: %s" % ("PASS" if overall == 0 else "FAIL"))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ inputs.repo }}
          path: out/
          if-no-files-found: warn
